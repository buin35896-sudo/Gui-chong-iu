<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gửi Người Mình Thương ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body, html {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at center, #2a121b 0%, #090306 100%);
    font-family: 'Montserrat', sans-serif; color: #fff;
  }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

  /* Màn 1: Hoa hồng mở đầu */
  #intro-screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #3b1925 0%, #0d0508 100%);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .rose-wrap {
    position: relative; width: 160px; height: 220px;
    display: flex; flex-direction: column; align-items: center;
    animation: floatRose 3s ease-in-out infinite;
  }
  .rose-bloom {
    width: 90px; height: 90px; position: relative;
    transform: scale(0.2); opacity: 0;
    animation: bloomAnim 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .petal {
    position: absolute; inset: 0; border-radius: 50% 50% 20% 20%;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 40%, #d46a7e 100%);
    box-shadow: 0 0 25px rgba(255, 154, 158, 0.5);
    transform-origin: bottom center;
  }
  .petal:nth-child(1) { transform: rotate(-35deg) scale(0.95); opacity: 0.85; }
  .petal:nth-child(2) { transform: rotate(35deg) scale(0.95); opacity: 0.85; }
  .petal:nth-child(3) { transform: rotate(-18deg) scale(1.02); }
  .petal:nth-child(4) { transform: rotate(18deg) scale(1.02); }
  .petal:nth-child(5) { transform: scale(1.05); background: linear-gradient(135deg, #ffb6c1, #c94b63); }
  .stem {
    width: 4px; height: 120px; background: linear-gradient(to bottom, #6b8e23, #2e4012);
    border-radius: 2px; margin-top: -10px;
  }
  .leaf {
    position: absolute; width: 32px; height: 16px; background: #4f6d19;
    border-radius: 0 50% 0 50%; top: 125px;
  }
  .leaf.left { left: 45px; transform: rotate(-20deg); }
  .leaf.right { right: 45px; transform: scaleX(-1) rotate(-20deg); top: 145px; }
  .intro-text {
    margin-top: 25px; font-family: 'Cormorant Garamond', serif;
    font-size: 26px; letter-spacing: 2px; color: #ffd6e0;
    text-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
    opacity: 0; animation: fadeIn 1.5s ease 1s forwards;
  }

  /* Màn 2 & 3: Hướng dẫn chạm giữ */
  #hold-ui {
    position: fixed; bottom: 45px; left: 0; right: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
  }
  #hold-ui.active { opacity: 1; pointer-events: auto; }
  .hold-ring {
    width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid rgba(255, 182, 193, 0.6);
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 105, 135, 0.4);
    transition: transform 0.2s ease;
  }
  .hold-ring:active, .hold-ring.holding { transform: scale(1.15); border-color: #ff4d6d; }
  .hold-core {
    width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle, #ff758f, #ff4d6d);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 0 15px #ff4d6d;
  }
  .hold-label {
    margin-top: 12px; font-size: 13px; letter-spacing: 1px;
    color: rgba(255, 220, 230, 0.85); text-shadow: 0 2px 8px #000;
  }

  /* Màn 4: Bức thư điện tử */
  #letter-modal {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(15, 5, 10, 0.65); backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity 1s ease;
  }
  #letter-modal.show { opacity: 1; pointer-events: auto; }
  .letter-card {
    width: 100%; max-width: 390px; max-height: 88vh; overflow-y: auto;
    background: linear-gradient(180deg, #f5ebe0 0%, #e3d5ca 100%);
    color: #3d2c2e; border-radius: 14px; padding: 26px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 30px rgba(255, 182, 193, 0.3);
    text-align: center; transform: translateY(30px) scale(0.95);
    transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #letter-modal.show .letter-card { transform: translateY(0) scale(1); }
  .letter-title {
    font-family: 'Cormorant Garamond', serif; font-size: 28px;
    font-style: italic; color: #7f4f52; margin-bottom: 4px;
  }
  .letter-subtitle {
    font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
    color: #9c6669; margin-bottom: 18px;
  }
  .polaroid-main {
    background: #fff; padding: 10px 10px 26px 10px;
    border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    transform: rotate(-1.5deg); margin-bottom: 20px;
  }
  .polaroid-main img {
    width: 100%; height: 230px; object-fit: cover; display: block; border-radius: 2px;
  }
  .letter-body {
    font-family: 'Cormorant Garamond', serif; font-size: 19px;
    line-height: 1.65; color: #2b1d1e; min-height: 110px;
    white-space: pre-line; text-align: center;
  }
  .close-btn {
    margin-top: 20px; padding: 10px 26px; border: 1px solid #b5838d;
    background: transparent; color: #6d4c4e; border-radius: 25px;
    font-family: 'Montserrat', sans-serif; font-size: 13px; cursor: pointer;
    transition: all 0.3s ease;
  }
  .close-btn:hover { background: #b5838d; color: #fff; }

  @keyframes bloomAnim {
    0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes floatRose {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>

  <!-- Nhạc nền -->
  <audio id="bg-music" loop></audio>

  <!-- Canvas 3D cho chữ bay, ảnh kỷ niệm & trái tim hạt sáng -->
  <canvas id="scene"></canvas>

  <!-- Màn 1: Hoa hồng bung nở -->
  <div id="intro-screen">
    <div class="rose-wrap">
      <div class="rose-bloom">
        <div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
      </div>
      <div class="stem"></div>
      <div class="leaf left"></div>
      <div class="leaf right"></div>
    </div>
    <div class="intro-text" id="intro-caption">Gửi Anh ❤️</div>
  </div>

  <!-- Nút chạm giữ -->
  <div id="hold-ui">
    <div class="hold-ring" id="hold-btn">
      <div class="hold-core">❤️</div>
    </div>
    <div class="hold-label" id="hold-text">Chạm & giữ để gom yêu thương</div>
  </div>

  <!-- Màn 4: Bức thư mở ra -->
  <div id="letter-modal">
    <div class="letter-card">
      <div class="letter-title" id="card-title">Gửi Anh ❤️</div>
      <div class="letter-subtitle" id="card-subtitle">GỬI NGƯỜI MÌNH THƯƠNG</div>
      <div class="polaroid-main">
        <img id="main-photo" src="" alt="Kỷ niệm">
      </div>
      <div class="letter-body" id="typewriter-text"></div>
      <button class="close-btn" onclick="resetExperience()">Đóng lá thư</button>
    </div>
  </div>

<script>
  // =========================================================================
  // 1. PHẦN CÀI ĐẶT CÁ NHÂN HÓA (BẠN CHỈ CẦN SỬA NỘI DUNG Ở ĐÂY)
  // =========================================================================
  const CONFIG = {
    musicFile: "nhac.mp3", // Tên file nhạc .mp3 bạn tải lên cùng thư mục
    introTitle: "Gửi Anh ❤️",
    letterTitle: "Gửi Anh ❤️",
    letterSubtitle: "GỬI NGƯỜI MÌNH THƯƠNG",
    mainPhoto: "IMG_2443.jpeg", // Ảnh chính hiển thị trong bức thư
    floatingPhotos: ["IMG_2443.jpeg", "IMG_7426.png", "1D806F0D-4814-434C-A636-5FA204F8EEE5.png", "IMG_4174.jpeg"], // Các ảnh Polaroid bay lơ lửng
    floatingTexts: [
      "Chúc mừng ngày 19/11 ❤️",
      "Chúc anh luôn vui vẻ",
      "Quốc tế đàn ông ✨",
      "Cảm ơn vì đã đến bên em",
      "Mãi bên nhau nhé ❤️"
    ],
    letterContent: `"Chúc mừng ngày 19/11 của người đàn ông tuyệt vời nhất nhà! Cảm ơn chồng vì thời gian qua đã luôn là điểm tựa vững chắc, bao dung và kiên nhẫn chịu đựng những lúc vợ stress, cau có hay mệt mỏi. Có thể vợ không nói ra nhiều, nhưng vợ luôn biết ơn vì chồng đã ở bên, lặng lẽ san sẻ và cùng vợ đi qua những ngày áp lực nhất. Chúc chồng luôn mạnh khỏe, bình an và mãi là bến đỗ bình yên của hai mẹ con/vợ chồng mình nhé!"
"Nhân ngày Quốc tế Nam giới 19/11, chúc chồng yêu luôn nhiều sức khỏe, công việc hanh thông và giữ mãi nụ cười ấm áp. Cảm ơn anh vì đã không chỉ yêu những lúc em vui vẻ, mà còn thương và nhẫn nại với cả những lúc em cáu gắt, kiệt sức vì áp lực. Cảm ơn chồng đã luôn đồng hành cùng vợ!".\n\nBống`
  };
  // =========================================================================

  // Gán dữ liệu từ CONFIG vào giao diện
  document.getElementById("bg-music").src = CONFIG.musicFile;
  document.getElementById("intro-caption").innerText = CONFIG.introTitle;
  document.getElementById("card-title").innerText = CONFIG.letterTitle;
  document.getElementById("card-subtitle").innerText = CONFIG.letterSubtitle;
  document.getElementById("main-photo").src = CONFIG.mainPhoto;

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  // Tải trước ảnh bay lơ lửng
  const loadedImages = CONFIG.floatingPhotos.map(src => {
    const img = new Image();
    img.src = src;
    return img;
  });

  // Trạng thái ứng dụng: 'intro' -> 'floating' -> 'gathering' -> 'letter'
  let state = "intro";
  let holdProgress = 0; // 0 -> 1
  let isHolding = false;
  let musicStarted = false;

  function playMusic() {
    if (!musicStarted) {
      const audio = document.getElementById("bg-music");
      audio.play().then(() => { musicStarted = true; }).catch(() => {});
    }
  }
  document.body.addEventListener("touchstart", playMusic, { once: true });
  document.body.addEventListener("click", playMusic, { once: true });

  // Chuyển từ màn hoa hồng sang màn không gian 3D sau 3.5 giây
  setTimeout(() => {
    const intro = document.getElementById("intro-screen");
    intro.style.opacity = "0";
    intro.style.transform = "scale(1.15)";
    setTimeout(() => {
      intro.style.display = "none";
      state = "floating";
      document.getElementById("hold-ui").classList.add("active");
    }, 1100);
  }, 3500);

  // Tạo các phần tử chữ bay 3D
  const textItems = Array.from({ length: 24 }, (_, i) => ({
    text: CONFIG.floatingTexts[i % CONFIG.floatingTexts.length],
    x: (Math.random() - 0.5) * 1400,
    y: (Math.random() - 0.5) * 1200,
    z: Math.random() * 1000,
    speed: 1.8 + Math.random() * 1.5
  }));

  // Tạo các khung ảnh Polaroid bay 3D
  const photoItems = Array.from({ length: 6 }, (_, i) => ({
    img: loadedImages[i % loadedImages.length],
    x: (Math.random() - 0.5) * 900,
    y: (Math.random() - 0.5) * 900,
    z: 200 + Math.random() * 800,
    rot: (Math.random() - 0.5) * 0.4,
    speed: 1.5 + Math.random()
  }));

  // Tạo cánh hoa rơi & hạt sáng tạo hình trái tim
  const heartParticles = [];
  const totalParticles = 420;
  for (let i = 0; i < totalParticles; i++) {
    const t = (Math.PI * 2 * i) / totalParticles;
    // Phương trình đường cong trái tim
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    heartParticles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 1.2,
      vy: 0.5 + Math.random() * 1.5,
      hx: hx * 11,
      hy: hy * 11,
      size: 2 + Math.random() * 3,
      color: Math.random() > 0.3 ? "#ff758f" : "#ffd6e0"
    });
  }

  // Xử lý sự kiện nhấn giữ nút
  const holdBtn = document.getElementById("hold-btn");
  const holdText = document.getElementById("hold-text");

  function startHold(e) {
    e.preventDefault();
    playMusic();
    if (state !== "floating") return;
    isHolding = true;
    holdBtn.classList.add("holding");
    holdText.innerText = "Giữ nguyên nhé...";
  }
  function endHold() {
    isHolding = false;
    holdBtn.classList.remove("holding");
    if (holdProgress < 1 && state === "floating") {
      holdText.innerText = "Chạm & giữ để gom yêu thương";
    }
  }

  holdBtn.addEventListener("mousedown", startHold);
  holdBtn.addEventListener("touchstart", startHold);
  window.addEventListener("mouseup", endHold);
  window.addEventListener("touchend", endHold);

  // Vòng lặp vẽ hiệu ứng
  function animate() {
    ctx.clearRect(0, 0, W, H);
    const fov = 450;

    // Cập nhật tiến trình gom trái tim
    if (state === "floating") {
      if (isHolding) {
        holdProgress = Math.min(1, holdProgress + 0.012);
        if (holdProgress >= 1) {
          openLetter();
        }
      } else {
        holdProgress = Math.max(0, holdProgress - 0.02);
      }
    }

    // 1. Vẽ chữ 3D bay tới
    if (state === "floating" || state === "intro") {
      ctx.save();
      ctx.globalAlpha = 1 - holdProgress * 0.75;
      textItems.forEach(item => {
        item.z -= item.speed;
        if (item.z <= 10) {
          item.z = 1000;
          item.x = (Math.random() - 0.5) * 1400;
          item.y = (Math.random() - 0.5) * 1200;
        }
        const scale = fov / (fov + item.z);
        const sx = W / 2 + item.x * scale;
        const sy = H / 2 + item.y * scale;

        ctx.font = `600 ${Math.max(10, 26 * scale)}px 'Montserrat', sans-serif`;
        ctx.fillStyle = `rgba(255, 225, 235, ${Math.min(1, scale * 1.2)})`;
        ctx.shadowColor = "#ff4d6d";
        ctx.shadowBlur = 12 * scale;
        ctx.fillText(item.text, sx, sy);
      });

      // 2. Vẽ khung ảnh Polaroid bay 3D
      photoItems.forEach(p => {
        p.z -= p.speed;
        if (p.z <= 20) {
          p.z = 1000;
          p.x = (Math.random() - 0.5) * 900;
          p.y = (Math.random() - 0.5) * 900;
        }
        const scale = fov / (fov + p.z);
        const sx = W / 2 + p.x * scale;
        const sy = H / 2 + p.y * scale;
        const pw = 110 * scale;
        const ph = 135 * scale;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(p.rot);
        ctx.fillStyle = "#fff";
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 15 * scale;
        ctx.fillRect(-pw / 2, -ph / 2, pw, ph);

        if (p.img.complete && p.img.naturalWidth > 0) {
          const pad = 7 * scale;
          ctx.drawImage(p.img, -pw / 2 + pad, -ph / 2 + pad, pw - pad * 2, ph - pad * 3.2);
        }
        ctx.restore();
      });
      ctx.restore();
    }

    // 3. Vẽ các hạt sáng (rơi tự do hoặc hội tụ thành trái tim khi nhấn giữ)
    heartParticles.forEach(pt => {
      if (holdProgress > 0) {
        const targetX = W / 2 + pt.hx * (Math.min(W, H) / 420);
        const targetY = H / 2 - 30 + pt.hy * (Math.min(W, H) / 420);
        pt.x += (targetX - pt.x) * (0.04 + holdProgress * 0.08);
        pt.y += (targetY - pt.y) * (0.04 + holdProgress * 0.08);
      } else {
        pt.x += pt.vx;
        pt.y += pt.vy;
        if (pt.y > H) { pt.y = -10; pt.x = Math.random() * W; }
      }

      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fillStyle = pt.color;
      ctx.shadowColor = "#ff4d6d";
      ctx.shadowBlur = 10;
      ctx.fill();
    });

    requestAnimationFrame(animate);
  }
  animate();

  // Mở bức thư & chạy hiệu ứng đánh máy từng chữ
  let typingTimer;
  function openLetter() {
    state = "letter";
    document.getElementById("hold-ui").classList.remove("active");
    const modal = document.getElementById("letter-modal");
    modal.classList.add("show");

    const container = document.getElementById("typewriter-text");
    container.innerText = "";
    let idx = 0;
    clearInterval(typingTimer);
    typingTimer = setInterval(() => {
      if (idx < CONFIG.letterContent.length) {
        container.textContent += CONFIG.letterContent.charAt(idx);
        idx++;
      } else {
        clearInterval(typingTimer);
      }
    }, 45);
  }

  function resetExperience() {
    document.getElementById("letter-modal").classList.remove("show");
    holdProgress = 0;
    isHolding = false;
    state = "floating";
    holdText.innerText = "Chạm & giữ để gom yêu thương";
    document.getElementById("hold-ui").classList.add("active");
  }
</script>
</body>
</html>
