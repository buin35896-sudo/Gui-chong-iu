<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Anh ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #2b121d 0%, #14070d 65%, #090306 100%);
      font-family: 'Quicksand', sans-serif; color: #fff; user-select: none;
    }

    /* Màn 1: Hoa hồng mở đầu */
    #intro-screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #2d131f 0%, #11060b 80%);
      transition: opacity 1.1s ease, transform 1.1s ease;
      cursor: pointer;
    }
    .rose-wrap {
      position: relative; width: 200px; height: 240px;
      display: flex; flex-direction: column; align-items: center;
      animation: floatRose 3.5s ease-in-out infinite;
    }
    .rose-bloom {
      width: 140px; height: 75px; position: relative;
      transform: scale(0.2); opacity: 0;
      animation: bloomAnim 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      filter: drop-shadow(0 6px 18px rgba(255, 165, 180, 0.45));
    }
    .petal {
      position: absolute; bottom: 8px; left: 50%;
      border-radius: 75% 15% 75% 15%;
      background: linear-gradient(160deg, #ffe5ec 0%, #f497a9 45%, #b55468 100%);
      box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.5), 0 4px 10px rgba(0, 0, 0, 0.25);
      transform-origin: bottom center;
    }
    .p1 { width: 72px; height: 42px; margin-left: -62px; transform: rotate(-58deg); z-index: 1; }
    .p2 { width: 72px; height: 42px; margin-left: -10px; transform: rotate(58deg) scaleX(-1); z-index: 1; }
    .p3 { width: 62px; height: 46px; margin-left: -48px; transform: rotate(-32deg); z-index: 2; }
    .p4 { width: 62px; height: 46px; margin-left: -14px; transform: rotate(32deg) scaleX(-1); z-index: 2; }
    .p5 { width: 52px; height: 48px; margin-left: -26px; transform: rotate(0deg); z-index: 3; border-radius: 50% 50% 45% 45%; }
    .rose-bloom::after {
      content: ""; position: absolute; bottom: -4px; left: 50%; margin-left: -18px;
      width: 36px; height: 14px;
      background: linear-gradient(to bottom, #6b8e68, #3d5a3c);
      border-radius: 0 0 50% 50%; z-index: 4;
    }
    .stem {
      width: 3.5px; height: 145px;
      background: linear-gradient(to right, #8fae8b, #4c6b49);
      border-radius: 3px; margin-top: -6px;
    }
    .leaf {
      position: absolute; width: 34px; height: 14px;
      background: linear-gradient(135deg, #98b894, #4c6b49);
      border-radius: 0 70% 0 70%;
    }
    .leaf.left { left: 66px; top: 135px; transform: rotate(-28deg); }
    .leaf.right { right: 66px; top: 105px; transform: scaleX(-1) rotate(-25deg); }

    .intro-text {
      margin-top: 22px; font-family: 'Cormorant Garamond', serif;
      font-size: 28px; letter-spacing: 2px; color: #ffd6e0;
      text-shadow: 0 0 15px rgba(255, 182, 193, 0.7);
      opacity: 0; animation: fadeIn 1.4s ease 0.8s forwards;
    }
    .tap-hint {
      margin-top: 12px; font-size: 13px; color: rgba(255, 214, 224, 0.65);
      letter-spacing: 1px; opacity: 0; animation: pulseHint 2s ease-in-out 1.5s infinite;
    }

    /* Màn 2: Hiệu ứng ảnh bay & cánh hoa rơi */
    #gallery-stage {
      position: fixed; inset: 0; z-index: 5;
      opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
    }
    #gallery-stage.active { opacity: 1; pointer-events: auto; }

    .floating-photo {
      position: absolute; bottom: -220px;
      width: 135px; height: 175px; object-fit: cover;
      border-radius: 12px; border: 3px solid rgba(255, 240, 245, 0.85);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 18px rgba(255, 165, 185, 0.3);
      animation: floatUp linear forwards;
    }
    .falling-petal {
      position: absolute; top: -30px;
      width: 14px; height: 18px;
      background: linear-gradient(135deg, #ffd6e0, #e5738a);
      border-radius: 75% 15% 75% 15%;
      opacity: 0.75; pointer-events: none;
      animation: fallDown linear forwards;
    }

    /* Nút mở thư */
    #open-letter-btn {
      position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%);
      z-index: 15; padding: 13px 28px; border-radius: 30px;
      background: linear-gradient(135deg, #ff8fa3, #c94a6a);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff; font-family: 'Quicksand', sans-serif;
      font-size: 15px; font-weight: 600; letter-spacing: 0.5px;
      box-shadow: 0 8px 25px rgba(201, 74, 106, 0.55);
      cursor: pointer; opacity: 0; pointer-events: none;
      transition: all 0.5s ease;
    }
    #open-letter-btn.show { opacity: 1; pointer-events: auto; }
    #open-letter-btn:active { transform: translateX(-50%) scale(0.95); }

    /* Màn 3: Bức thư lời chúc */
    #letter-modal {
      position: fixed; inset: 0; z-index: 25;
      background: rgba(12, 4, 8, 0.82); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #letter-modal.open { opacity: 1; pointer-events: auto; }

    .letter-card {
      width: 100%; max-width: 400px; max-height: 84vh; overflow-y: auto;
      background: linear-gradient(180deg, #fff8fa 0%, #ffeef2 100%);
      color: #4a202c; border-radius: 20px; padding: 26px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 182, 193, 0.35);
      border: 1px solid rgba(255, 192, 203, 0.6);
      transform: translateY(25px) scale(0.96); transition: transform 0.6s ease;
      text-align: center;
    }
    #letter-modal.open .letter-card { transform: translateY(0) scale(1); }

    .letter-photo {
      width: 130px; height: 130px; object-fit: cover;
      border-radius: 50%; border: 4px solid #fff;
      box-shadow: 0 6px 18px rgba(181, 84, 104, 0.3);
      margin-bottom: 14px;
    }
    .letter-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px; font-weight: 600; color: #b53856;
      margin-bottom: 4px;
    }
    .letter-subtitle {
      font-size: 13px; color: #9c5a6c; margin-bottom: 16px; letter-spacing: 0.5px;
    }
    .letter-body {
      font-size: 15px; line-height: 1.7; color: #3d1c26;
      text-align: left; background: rgba(255, 255, 255, 0.7);
      padding: 16px; border-radius: 14px;
      border: 1px dashed rgba(201, 74, 106, 0.3);
    }
    .letter-body p + p { margin-top: 12px; }

    .close-letter {
      margin-top: 18px; padding: 9px 24px; border-radius: 20px;
      background: #b53856; color: #fff; border: none;
      font-family: 'Quicksand', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }

    @keyframes bloomAnim {
      0% { transform: scale(0.2) translateY(15px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes floatRose {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes pulseHint {
      0%, 100% { opacity: 0.35; transform: scale(0.98); }
      50% { opacity: 0.95; transform: scale(1.02); }
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(var(--rot)); opacity: 0; }
      12% { opacity: 0.95; }
      88% { opacity: 0.95; }
      100% { transform: translateY(-125vh) rotate(calc(var(--rot) * -1)); opacity: 0; }
    }
    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
      15% { opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(40px); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Màn 1: Hoa hồng -->
  <div id="intro-screen">
    <div class="rose-wrap">
      <div class="rose-bloom">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
      </div>
      <div class="stem">
        <div class="leaf left"></div>
        <div class="leaf right"></div>
      </div>
    </div>
    <div class="intro-text">Gửi Anh ❤️</div>
    <div class="tap-hint">Chạm vào bông hoa để mở quà...</div>
  </div>

  <!-- Màn 2: Không gian ảnh bay -->
  <div id="gallery-stage"></div>
  <button id="open-letter-btn">💌 Đọc thư gửi chồng yêu</button>

  <!-- Màn 3: Bức thư lời chúc -->
  <div id="letter-modal">
    <div class="letter-card">
      <img id="main-photo-img" class="letter-photo" src="" alt="Kỷ niệm">
      <div id="letter-title-el" class="letter-title"></div>
      <div id="letter-sub-el" class="letter-subtitle"></div>
      <div id="letter-body-el" class="letter-body"></div>
      <button class="close-letter" id="close-letter-btn">Ngắm lại ảnh ✨</button>
    </div>
  </div>

  <!-- Nhạc nền -->
  <audio id="bg-music" src="nhac.mp3" loop preload="auto"></audio>

  <script>
    const CONFIG = {
      mainPhoto: "IMG_2443.jpeg",
      floatingPhotos: ["IMG_2443.jpeg", "IMG_7426.png", "1D806F0D-4814-434C-A636-5FA204F8EEE5.png", "IMG_4174.jpeg"],
      letterTitle: "Gửi Chồng Yêu ❤️",
      letterSubtitle: "Chúc mừng ngày Quốc tế Nam giới 19/11",
      letterMessages: [
        "Chúc mừng 19/11 chồng yêu! Cảm ơn anh vì đã luôn bao dung và ở bên cạnh những lúc vợ stress, mệt mỏi và khó tính nhất. Chúc chồng luôn khỏe mạnh, vui vẻ và thành công. Yêu chồng nhiều!",
        "19/11 vui vẻ nhé người hùng của vợ! Cảm ơn chồng vì đã kiên nhẫn làm 'thùng rác cảm xúc' và cùng vợ vượt qua bao ngày căng thẳng vừa qua. Mong chồng luôn bình an và hạnh phúc bên cạnh vợ ạaaaaa ❤️"
      ]
    };

    // Gán dữ liệu vào bức thư
    document.getElementById("main-photo-img").src = CONFIG.mainPhoto;
    document.getElementById("letter-title-el").textContent = CONFIG.letterTitle;
    document.getElementById("letter-sub-el").textContent = CONFIG.letterSubtitle;
    const bodyEl = document.getElementById("letter-body-el");
    CONFIG.letterMessages.forEach(msg => {
      const p = document.createElement("p");
      p.textContent = msg;
      bodyEl.appendChild(p);
    });

    const introScreen = document.getElementById("intro-screen");
    const galleryStage = document.getElementById("gallery-stage");
    const openLetterBtn = document.getElementById("open-letter-btn");
    const letterModal = document.getElementById("letter-modal");
    const closeLetterBtn = document.getElementById("close-letter-btn");
    const bgMusic = document.getElementById("bg-music");

    let started = false;
    let photoIdx = 0;

    function spawnPhoto() {
      const img = document.createElement("img");
      img.src = CONFIG.floatingPhotos[photoIdx % CONFIG.floatingPhotos.length];
      photoIdx++;
      img.className = "floating-photo";
      const leftPos = 8 + Math.random() * 62;
      const duration = 7.5 + Math.random() * 3.5;
      const rot = (Math.random() * 16 - 8).toFixed(1) + "deg";
      img.style.left = leftPos + "%";
      img.style.animationDuration = duration + "s";
      img.style.setProperty("--rot", rot);
      galleryStage.appendChild(img);
      setTimeout(() => img.remove(), duration * 1000);
    }

    function spawnPetal() {
      const petal = document.createElement("div");
      petal.className = "falling-petal";
      petal.style.left = Math.random() * 100 + "%";
      const duration = 5 + Math.random() * 4;
      petal.style.animationDuration = duration + "s";
      galleryStage.appendChild(petal);
      setTimeout(() => petal.remove(), duration * 1000);
    }

    introScreen.addEventListener("click", () => {
      if (started) return;
      started = true;

      // Phát nhạc nền
      bgMusic.play().catch(() => {});

      // Ẩn màn hoa hồng, hiện màn ảnh bay
      introScreen.style.opacity = "0";
      introScreen.style.transform = "scale(1.08)";
      setTimeout(() => { introScreen.style.display = "none"; }, 1100);

      galleryStage.classList.add("active");
      spawnPhoto();
      setInterval(spawnPhoto, 2200);
      setInterval(spawnPetal, 600);

      // Hiện nút mở thư sau 3 giây ngắm ảnh
      setTimeout(() => {
        openLetterBtn.classList.add("show");
      }, 3000);
    });

    openLetterBtn.addEventListener("click", () => {
      letterModal.classList.add("open");
    });

    closeLetterBtn.addEventListener("click", () => {
      letterModal.classList.remove("open");
    });
  </script>
</body>
</html>
