<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Anh - 19/11 ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090306;
      font-family: 'Quicksand', sans-serif;
      color: #fff;
      user-select: none;
    }

    /* ==================== MÀN 1: HOA HỒNG NỞ ==================== */
    #scene-rose {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 42%, #2d121e 0%, #14070d 65%, #090306 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 60;
      cursor: pointer;
      transition: opacity 1s ease, transform 1s ease;
    }

    .rose-wrap {
      animation: floatRose 3.6s ease-in-out infinite;
    }

    .intro-title {
      margin-top: 14px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 700;
      color: #ffe5ec;
      text-shadow: 0 0 18px rgba(255, 140, 170, 0.75);
      opacity: 0;
      animation: fadeIn 1.2s ease 0.7s forwards;
    }

    .intro-hint {
      margin-top: 8px;
      font-size: 13px;
      color: rgba(255, 214, 224, 0.8);
      opacity: 0;
      animation: fadeIn 1.2s ease 1.3s forwards, pulseHint 2s ease-in-out 2.5s infinite;
    }

    /* ==================== MÀN 2: TIM RƠI + CHỮ BAY + ẢNH TUNG ==================== */
    #scene-shower {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, #240912 0%, #0d0306 70%, #050103 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
      overflow: hidden;
      z-index: 40;
    }

    #scene-shower.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Dòng chữ chúc bay ngang giống video */
    .marquee-line {
      position: absolute;
      white-space: nowrap;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      color: rgba(255, 235, 240, 0.85);
      text-shadow: 0 0 12px rgba(255, 110, 145, 0.75);
      pointer-events: none;
      animation: slideAcross linear infinite;
      z-index: 5;
    }

    /* Tim đỏ và cánh hoa rơi từ trên xuống */
    .drop-item {
      position: absolute;
      top: -45px;
      pointer-events: none;
      animation: dropDown linear forwards;
      z-index: 8;
    }

    .drop-heart {
      filter: drop-shadow(0 0 10px rgba(255, 60, 100, 0.9));
    }

    .drop-petal {
      width: 14px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, #ffd6e0, #e56b86);
      border-radius: 65% 35% 65% 35% / 60% 40% 60% 40%;
      box-shadow: 0 0 8px rgba(255, 150, 175, 0.5);
    }

    /* Ảnh Polaroid tung/rơi trên màn hình */
    .polaroid-fly {
      position: absolute;
      top: -210px;
      width: 122px;
      background: #fff;
      padding: 6px 6px 18px 6px;
      border-radius: 4px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.75), 0 0 14px rgba(255, 160, 185, 0.35);
      animation: photoDrop linear forwards;
      z-index: 12;
      pointer-events: none;
    }

    .polaroid-fly img {
      width: 100%;
      height: 132px;
      object-fit: cover;
      display: block;
      border-radius: 2px;
    }

    .polaroid-fly::after {
      content: "❤️";
      display: block;
      text-align: center;
      font-size: 10px;
      margin-top: 4px;
    }

    /* Vòng tròn tim hạt lấp lánh khi chạm giữ */
    #particle-heart-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    /* Nút chạm & giữ gom yêu thương */
    #hold-zone {
      position: fixed;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 30;
    }

    #hold-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid rgba(255, 192, 203, 0.65);
      background: rgba(255, 105, 140, 0.16);
      box-shadow: 0 0 22px rgba(255, 105, 140, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.25s ease;
    }

    #hold-ring.holding {
      transform: scale(1.16);
      background: rgba(255, 105, 140, 0.35);
      box-shadow: 0 0 34px rgba(255, 130, 160, 0.9);
    }

    #hold-progress-svg {
      position: absolute;
      inset: -4px;
      width: 76px;
      height: 76px;
      transform: rotate(-90deg);
    }

    #hold-progress-circle {
      fill: none;
      stroke: #ff9ebb;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 214;
      stroke-dashoffset: 214;
      transition: stroke-dashoffset 0.08s linear;
    }

    .hold-label {
      margin-top: 10px;
      font-size: 13px;
      color: #ffe5ec;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.4px;
    }

    /* ==================== MÀN 3: TRÁI TIM TO ĐÙNG PHÁT SÁNG ==================== */
    #scene-bigheart {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #5c2a3a 0%, #261018 58%, #12060a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
      z-index: 50;
      cursor: pointer;
    }

    #scene-bigheart.active {
      opacity: 1;
      pointer-events: auto;
    }

    .bigheart-sub {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 230, 238, 0.85);
      margin-bottom: 4px;
    }

    .bigheart-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 160, 185, 0.85);
      margin-bottom: 18px;
    }

    .bigheart-box {
      position: relative;
      width: 260px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: heartBeat 2.4s ease-in-out infinite;
    }

    .orbit-ring {
      position: absolute;
      width: 290px;
      height: 110px;
      border: 1.5px dashed rgba(255, 225, 235, 0.55);
      border-radius: 50%;
      transform: rotate(-14deg);
      box-shadow: 0 0 16px rgba(255, 180, 200, 0.35);
    }

    .bigheart-tap {
      margin-top: 26px;
      font-size: 13px;
      color: rgba(255, 225, 235, 0.85);
      animation: pulseHint 1.8s infinite;
    }

    /* ==================== MÀN 4: LÁ THƯ ĐÁNH TỪNG CHỮ ==================== */
    #scene-letter {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, #f5ebe0 0%, #e3d5ca 65%, #d5bdaf 100%);
      color: #3d251e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 24px 20px;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: opacity 0.9s ease, transform 0.9s ease;
      z-index: 70;
    }

    #scene-letter.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .letter-header-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 32px;
      font-weight: 700;
      color: #4a2c2a;
    }

    .letter-header-sub {
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #8c6d62;
      margin-top: 2px;
      margin-bottom: 18px;
    }

    .letter-polaroid {
      width: 225px;
      background: #fff;
      padding: 10px 10px 26px 10px;
      border-radius: 3px;
      box-shadow: 0 12px 30px rgba(61, 37, 30, 0.22);
      transform: rotate(-1.5deg);
      margin-bottom: 22px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .letter-polaroid img {
      width: 100%;
      height: 215px;
      object-fit: cover;
      display: block;
    }

    .letter-typed-box {
      width: 100%;
      max-width: 380px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.55;
      color: #3b231e;
      text-align: center;
      min-height: 190px;
    }

    .letter-typed-box p {
      margin-bottom: 14px;
    }

    .cursor-blink {
      display: inline-block;
      width: 2px;
      height: 19px;
      background: #7f4f45;
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    .letter-sign {
      margin-top: 6px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 22px;
      color: #5e3a32;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .replay-btn {
      margin-top: 18px;
      padding: 9px 24px;
      border-radius: 22px;
      border: 1px solid #b08978;
      background: rgba(255, 255, 255, 0.65);
      color: #5e3a32;
      font-family: 'Quicksand', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    /* ==================== KEYFRAMES ==================== */
    @keyframes bloomAnim {
      0% { transform: scale(0.22) translateY(25px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    @keyframes floatRose {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.45; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    @keyframes slideAcross {
      0% { transform: translateX(105vw); }
      100% { transform: translateX(-115%); }
    }

    @keyframes dropDown {
      0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
      12% { opacity: 0.95; }
      100% { transform: translateY(112vh) rotate(260deg) translateX(22px); opacity: 0; }
    }

    @keyframes photoDrop {
      0% { transform: translateY(0) rotate(var(--rot, -5deg)) scale(0.88); opacity: 0; }
      12% { opacity: 1; }
      88% { opacity: 1; }
      100% { transform: translateY(132vh) rotate(calc(var(--rot, -5deg) * -1.4)) scale(1); opacity: 0; }
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.06); }
      50% { transform: scale(0.99); }
      75% { transform: scale(1.05); }
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- MÀN 1: HOA HỒNG NỞ -->
  <div id="scene-rose">
    <div class="rose-wrap">
      <svg width="210" height="250" viewBox="0 0 210 250" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 8px 22px rgba(255, 130, 160, 0.55)); animation: bloomAnim 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;">
        <path d="M105 95 C103 145, 107 195, 105 240" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round"/>
        <path d="M105 145 C132 135, 152 145, 148 160 C134 166, 115 158, 105 145 Z" fill="url(#leafGrad)"/>
        <path d="M104 178 C77 168, 57 178, 61 193 C75 199, 94 191, 104 178 Z" fill="url(#leafGrad)"/>
        <path d="M105 96 C90 106, 76 112, 72 108 C82 98, 92 92, 105 92 C118 92, 128 98, 138 108 C134 112, 120 106, 105 96 Z" fill="#4f734c"/>
        <path d="M105 96 L96 114 L105 104 L114 114 Z" fill="#3b5938"/>
        <path d="M105 95 C52 95, 32 62, 58 44 C76 32, 95 55, 105 72 C115 55, 134 32, 152 44 C178 62, 158 95, 105 95 Z" fill="url(#petalOuter)"/>
        <path d="M105 92 C64 90, 52 54, 78 38 C92 30, 100 46, 105 60 C110 46, 118 30, 132 38 C158 54, 146 90, 105 92 Z" fill="url(#petalMid)"/>
        <path d="M105 86 C80 84, 74 52, 92 36 C100 29, 110 29, 118 36 C136 52, 130 84, 105 86 Z" fill="url(#petalInner)"/>
        <path d="M90 50 C98 40, 112 40, 120 50 C114 60, 96 60, 90 50 Z" fill="#ffd6e0" opacity="0.85"/>
        <defs>
          <linearGradient id="stemGrad" x1="105" y1="95" x2="105" y2="240" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8cb388"/><stop offset="1" stop-color="#3c5939"/>
          </linearGradient>
          <linearGradient id="leafGrad" x1="60" y1="140" x2="150" y2="195" gradientUnits="userSpaceOnUse">
            <stop stop-color="#98bf93"/><stop offset="1" stop-color="#456642"/>
          </linearGradient>
          <linearGradient id="petalOuter" x1="105" y1="35" x2="105" y2="95" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffc2d1"/><stop offset="0.6" stop-color="#e56b86"/><stop offset="1" stop-color="#9e354d"/>
          </linearGradient>
          <linearGradient id="petalMid" x1="105" y1="32" x2="105" y2="92" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffe5ec"/><stop offset="0.55" stop-color="#f2849e"/><stop offset="1" stop-color="#b5435c"/>
          </linearGradient>
          <linearGradient id="petalInner" x1="105" y1="28" x2="105" y2="86" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff0f3"/><stop offset="0.5" stop-color="#ff9ebb"/><stop offset="1" stop-color="#c94a6a"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="intro-title">Gửi Anh ❤️</div>
    <div class="intro-hint">Chạm vào bông hoa để mở quà...</div>
  </div>

  <!-- MÀN 2: TIM RƠI + ẢNH TUNG + CHỮ BAY -->
  <div id="scene-shower">
    <canvas id="particle-heart-canvas"></canvas>
    <div id="hold-zone">
      <div id="hold-ring">
        <svg id="hold-progress-svg" viewBox="0 0 76 76">
          <circle id="hold-progress-circle" cx="38" cy="38" r="34"></circle>
        </svg>
        <span style="font-size: 24px;">❤️</span>
      </div>
      <div class="hold-label" id="hold-text">chạm & giữ để gom yêu thương</div>
    </div>
  </div>

  <!-- MÀN 3: TRÁI TIM TO ĐÙNG PHÁT SÁNG -->
  <div id="scene-bigheart">
    <div class="bigheart-sub">MỘT CHÚT THƯƠNG</div>
    <div class="bigheart-title">Gửi Anh ❤️</div>
    <div class="bigheart-box">
      <div class="orbit-ring"></div>
      <svg width="240" height="220" viewBox="0 0 240 220" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 28px rgba(255, 175, 195, 0.85));">
        <path d="M120 202 C120 202 18 136 18 68 C18 34 45 12 75 12 C95 12 112 23 120 38 C128 23 145 12 165 12 C195 12 222 34 222 68 C222 136 120 202 120 202 Z" fill="url(#bigHeartGrad)" stroke="#fff0f3" stroke-width="2.5"/>
        <circle cx="80" cy="65" r="14" fill="#fff" opacity="0.25"/>
        <circle cx="155" cy="80" r="9" fill="#fff" opacity="0.22"/>
        <circle cx="115" cy="135" r="18" fill="#ffe5ec" opacity="0.2"/>
        <defs>
          <radialGradient id="bigHeartGrad" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#fff5f7"/>
            <stop offset="45%" stop-color="#ffccd5"/>
            <stop offset="85%" stop-color="#f2849e"/>
            <stop offset="100%" stop-color="#c94a6a"/>
          </radialGradient>
        </defs>
      </svg>
    </div>
    <div class="bigheart-tap">Chạm vào trái tim để mở thư 💌</div>
  </div>

  <!-- MÀN 4: BỨC THƯ ĐÁNH TỪNG CHỮ -->
  <div id="scene-letter">
    <div class="letter-header-title">Gửi Anh ❤️</div>
    <div class="letter-header-sub">GỬI "NÓC NHÀ THỰC THỤ" CỦA EM</div>

    <div class="letter-polaroid" id="letter-photo-card" title="Chạm để đổi ảnh">
      <img id="letter-photo" src="IMG_2443.jpeg" alt="Kỷ niệm 19/11" />
    </div>

    <div class="letter-typed-box" id="typed-container"></div>
    <div class="letter-sign" id="letter-sign">Yêu chồng nhiều ❤️</div>
    <button class="replay-btn" id="replay-btn">Xem lại từ đầu ✨</button>
  </div>

  <!-- NHẠC NỀN -->
  <audio id="bg-music" src="nhac.mp3" loop preload="auto"></audio>

  <script>
    const sceneRose = document.getElementById("scene-rose");
    const sceneShower = document.getElementById("scene-shower");
    const sceneBigHeart = document.getElementById("scene-bigheart");
    const sceneLetter = document.getElementById("scene-letter");
    const holdRing = document.getElementById("hold-ring");
    const holdText = document.getElementById("hold-text");
    const progressCircle = document.getElementById("hold-progress-circle");
    const letterPhoto = document.getElementById("letter-photo");
    const letterPhotoCard = document.getElementById("letter-photo-card");
    const typedContainer = document.getElementById("typed-container");
    const letterSign = document.getElementById("letter-sign");
    const replayBtn = document.getElementById("replay-btn");
    const bgMusic = document.getElementById("bg-music");

    // 3 ảnh thật của bạn trên GitHub
    const photos = [
      "IMG_2443.jpeg",
      "IMG_4174.jpeg",
      "IMG_7426.png"
    ];

    // Các dòng chữ chúc chạy ngang nền 3D giống video
    const marqueeTexts = [
      "Chúc mừng ngày 19/11 ❤️",
      "Quốc tế đàn ông 19/11 ✨",
      "Chúc anh luôn vui vẻ 💕",
      "Nóc nhà thực thụ của em 🥰",
      "Vững tay chèo & khỏe mạnh nhé 💪",
      "Cảm ơn anh vì đã luôn ở bên em 🌹"
    ];

    // Nội dung bức thư sẽ được gõ từng chữ một
    const letterParagraphs = [
      "Chúc mừng ngày 19/11 của 'nóc nhà thực thụ'! Cảm ơn đồng chí chồng đã dũng cảm đồng hành, chịu đựng xuất sắc mọi cơn stress, cau có và 'nắng mưa thất thường' của vợ trong suốt thời gian qua. Chúc chồng luôn vững tay chèo, khỏe mạnh và giữ vững phong độ nhé!",
      "Nhân ngày Quốc tế Nam giới 19/11, xin gửi lời tri ân sâu sắc tới anh chồng kiên cường nhất năm vì đã vượt qua thử thách mang tên 'vợ đang stress'. Cảm ơn anh vì đã luôn nhường nhịn và ở bên em. Chúc anh một ngày thật vui và nhiều năng lượng!"
    ];

    let showerTimers = [];
    let photoIndex = 0;
    let letterPhotoIndex = 0;
    let holdProgress = 0;
    let isHolding = false;
    let holdInterval = null;
    let bigHeartOpened = false;

    // 1. Tạo các dòng chữ chạy ngang ở Màn 2
    function initMarquees() {
      const rows = 9;
      for (let i = 0; i < rows; i++) {
        const line = document.createElement("div");
        line.className = "marquee-line";
        const t1 = marqueeTexts[i % marqueeTexts.length];
        const t2 = marqueeTexts[(i + 2) % marqueeTexts.length];
        line.textContent = `${t1}     •     ${t2}     •     ${t1}`;
        line.style.top = (6 + i * 10) + "%";
        line.style.fontSize = (18 + (i % 3) * 6) + "px";
        line.style.opacity = (0.35 + (i % 3) * 0.22).toFixed(2);
        const dur = 11 + (i % 4) * 3;
        line.style.animationDuration = dur + "s";
        line.style.animationDelay = (-Math.random() * dur) + "s";
        sceneShower.appendChild(line);
      }
    }

    // 2. Thả tim đỏ & cánh hoa từ trên xuống
    function spawnDrop() {
      const el = document.createElement("div");
      const isHeart = Math.random() < 0.65;
      if (isHeart) {
        el.className = "drop-item drop-heart";
        el.textContent = Math.random() > 0.3 ? "❤️" : "💖";
        el.style.fontSize = (16 + Math.random() * 16) + "px";
      } else {
        el.className = "drop-item drop-petal";
      }
      el.style.left = Math.random() * 96 + "%";
      const dur = 4.2 + Math.random() * 3.5;
      el.style.animationDuration = dur + "s";
      sceneShower.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000);
    }

    // 3. Tung/rơi các tấm ảnh Polaroid
    function spawnPolaroid() {
      const src = photos[photoIndex % photos.length];
      photoIndex++;
      const card = document.createElement("div");
      card.className = "polaroid-fly";
      card.style.left = (8 + Math.random() * 62) + "%";
      card.style.setProperty("--rot", (Math.random() * 18 - 9).toFixed(1) + "deg");
      const dur = 6.5 + Math.random() * 2.5;
      card.style.animationDuration = dur + "s";

      const img = document.createElement("img");
      img.src = src;
      card.appendChild(img);

      sceneShower.appendChild(card);
      setTimeout(() => card.remove(), dur * 1000);
    }

    // 4. Hiệu ứng trái tim hạt ánh sáng tụ lại khi chạm giữ
    const canvas = document.getElementById("particle-heart-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function initParticles() {
      particles = [];
      const count = 170;
      const cx = canvas.width / 2;
      const cy = canvas.height * 0.44;
      const scale = Math.min(canvas.width, canvas.height) * 0.022;

      for (let i = 0; i < count; i++) {
        const t = (Math.PI * 2 * i) / count;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          tx: cx + hx * scale + (Math.random() - 0.5) * 14,
          ty: cy + hy * scale + (Math.random() - 0.5) * 14,
          size: 1.8 + Math.random() * 2.4,
          color: Math.random() > 0.35 ? "#ff8fa3" : "#ffffff"
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (holdProgress > 0) {
        const alpha = Math.min(1, holdProgress / 40);
        particles.forEach(p => {
          if (isHolding) {
            p.x += (p.tx - p.x) * 0.07;
            p.y += (p.ty - p.y) * 0.07;
          } else {
            p.x += (Math.random() - 0.5) * 4;
            p.y += (Math.random() - 0.5) * 4;
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = alpha;
          ctx.shadowBlur = 10;
          ctx.shadowColor = "#ff4d6d";
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }
      requestAnimationFrame(animateParticles);
    }
    initParticles();
    animateParticles();

    // Xử lý chạm & giữ vòng tròn gom yêu thương
    function startHold(e) {
      e.preventDefault();
      isHolding = true;
      holdRing.classList.add("holding");
      holdText.textContent = "Giữ nguyên nhé... ❤️";
    }

    function endHold() {
      isHolding = false;
      holdRing.classList.remove("holding");
      if (holdProgress < 100) {
        holdText.textContent = "chạm & giữ để gom yêu thương";
      }
    }

    holdRing.addEventListener("mousedown", startHold);
    holdRing.addEventListener("touchstart", startHold, { passive: false });
    window.addEventListener("mouseup", endHold);
    window.addEventListener("touchend", endHold);

    function startHoldLoop() {
      clearInterval(holdInterval);
      holdInterval = setInterval(() => {
        if (isHolding) {
          holdProgress = Math.min(100, holdProgress + 2.6);
        } else {
          holdProgress = Math.max(0, holdProgress - 1.8);
        }
        const offset = 214 - (214 * holdProgress) / 100;
        progressCircle.style.strokeDashoffset = offset;

        if (holdProgress >= 100) {
          clearInterval(holdInterval);
          goToBigHeart();
        }
      }, 40);
    }

    // Chuyển từ Màn 1 -> Màn 2
    sceneRose.addEventListener("click", () => {
      bgMusic.play().catch(() => {});
      sceneRose.style.opacity = "0";
      sceneRose.style.transform = "scale(1.08)";
      setTimeout(() => { sceneRose.style.display = "none"; }, 950);

      sceneShower.classList.add("active");
      initMarquees();
      spawnDrop();
      spawnPolaroid();
      showerTimers.push(setInterval(spawnDrop, 260));
      showerTimers.push(setInterval(spawnPolaroid, 1650));
      startHoldLoop();
    });

    // Chuyển từ Màn 2 -> Màn 3 (Trái tim to đùng)
    function goToBigHeart() {
      showerTimers.forEach(t => clearInterval(t));
      sceneShower.style.opacity = "0";
      setTimeout(() => { sceneShower.style.display = "none"; }, 900);

      sceneBigHeart.classList.add("active");
      // Tự động mở lá thư sau 3.2 giây nếu chưa bấm
      setTimeout(() => {
        if (!bigHeartOpened) openLetterScene();
      }, 3200);
    }

    sceneBigHeart.addEventListener("click", () => {
      if (!bigHeartOpened) openLetterScene();
    });

    // Chuyển từ Màn 3 -> Màn 4 (Bức thư đánh từng chữ)
    function openLetterScene() {
      bigHeartOpened = true;
      sceneBigHeart.style.opacity = "0";
      setTimeout(() => { sceneBigHeart.style.display = "none"; }, 850);

      sceneLetter.classList.add("active");
      typeLetter();
    }

    // Hiệu ứng gõ từng chữ trong bức thư
    function typeLetter() {
      typedContainer.innerHTML = "";
      letterSign.style.opacity = "0";
      replayBtn.style.opacity = "0";

      let pIdx = 0;
      let cIdx = 0;
      let currentP = document.createElement("p");
      typedContainer.appendChild(currentP);

      const cursor = document.createElement("span");
      cursor.className = "cursor-blink";
      currentP.appendChild(cursor);

      function step() {
        if (pIdx >= letterParagraphs.length) {
          cursor.remove();
          letterSign.style.opacity = "1";
          replayBtn.style.opacity = "1";
          return;
        }

        const text = letterParagraphs[pIdx];
        if (cIdx < text.length) {
          cursor.insertAdjacentText("beforebegin", text[cIdx]);
          cIdx++;
          sceneLetter.scrollTop = sceneLetter.scrollHeight;
          setTimeout(step, 34);
        } else {
          pIdx++;
          cIdx = 0;
          if (pIdx < letterParagraphs.length) {
            currentP = document.createElement("p");
            typedContainer.appendChild(currentP);
            currentP.appendChild(cursor);
            setTimeout(step, 350);
          } else {
            step();
          }
        }
      }
      setTimeout(step, 500);
    }

    // Chạm vào ảnh trong thư để đổi qua lại 3 tấm ảnh kỷ niệm
    letterPhotoCard.addEventListener("click", () => {
      letterPhotoIndex = (letterPhotoIndex + 1) % photos.length;
      letterPhoto.src = photos[letterPhotoIndex];
    });

    // Nút xem lại từ đầu
    replayBtn.addEventListener("click", () => {
      location.reload();
    });
  </script>
</body>
